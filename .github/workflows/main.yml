name: Deploy Laravel ke Jagoan Hosting
on:
  push:
    branches:
      - main

jobs:
  # ============================
  # JOB 1: TEST
  # ============================
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: mbstring, dom, fileinfo, mysql, sqlite3
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🏗️ Build Assets
        run: npm run build

      - name: 📝 Prepare .env for testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🧪 Run Laravel Tests
        run: php artisan test

  # ============================
  # JOB 2: FTP DEPLOY (hanya jalan kalau job test PASS)
  # ============================
  ftp-deploy:
    name: 📂 FTP Deploy
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, sqlite3
          coverage: none

      - name: 📦 Install Composer Dependencies (production)
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Assets
        run: npm run build

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Daftar file/folder yang tidak perlu diupload
          exclude: |
            node_modules/**
            .git/**
            .github/**
            README.md
            .env

  # ============================
  # JOB 3: NOTIFY (selalu jalan, laporkan status test & deploy)
  # ============================
  notify:
    name: 📣 Notify
    needs: [test, ftp-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USERNAME: "GitHub Actions Bot"
          DISCORD_AVATAR: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
        with:
          args: |
            ${{ needs.test.result == 'success' && (needs.ftp-deploy.result == 'success' && '✅ **TEST PASSED — Deploy berhasil**' || '⚠️ **TEST PASSED — tapi FTP Deploy GAGAL**') || '❌ **TEST FAILED — Deploy dibatalkan (FTP tidak dijalankan)**' }}
            Repository: **${{ github.repository }}**
            Branch: `${{ github.ref_name }}`
            Commit: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            Test status: **${{ needs.test.result }}**
            FTP Deploy status: **${{ needs.ftp-deploy.result }}**